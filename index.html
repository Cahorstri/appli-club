<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cahors Triathlon</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root {
  color-scheme: light;
  --fond: #F3F6F8;
  --surface: #FFFFFF;
  --encre: #1E2429;
  --doux: #5C6873;
  --trait: #D9E0E6;
  --eau: #0B6FA4;
  --route: #22292F;
  --piste: #C2336F;
  --vert: #2E7D4F;
  --eau-pale: #E3F0F7;
  --piste-pale: #FBE6EF;
  --texte: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --titre: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fond: #14191D; --surface: #1C2328; --encre: #E8EDF1; --doux: #9AA6B0; --trait: #2E3840;
    --eau: #4EA6D8; --route: #0E1215; --piste: #EC6FA5; --vert: #5DBB85;
    --eau-pale: #16303F; --piste-pale: #3A1A29;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fond); color: var(--encre);
  font: 16px/1.5 var(--texte);
  -webkit-font-smoothing: antialiased;
}
header.barre {
  position: sticky; top: 0; z-index: 20;
  background: #FFFFFF; color: #1E2429; border-bottom: 1px solid var(--trait);
  padding: env(safe-area-inset-top, 0px) 16px 0;
}
.barre-int { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 54px; max-width: 760px; margin: 0 auto; }
#club { margin: 0; line-height: 0; }
#club img { height: 40px; width: auto; display: block; }
#btn-compte {
  font: 600 15px var(--texte); color: #1E2429; background: #EEF2F5;
  border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; position: relative;
}
#btn-compte .badge { position: absolute; top: -4px; right: -4px; }
.tri { display: flex; height: 5px; margin: 0 -16px; }
.tri span { flex: 1; }
.tri span:nth-child(1) { background: #0B6FA4; }
.tri span:nth-child(2) { background: #22292F; }
.tri span:nth-child(3) { background: #C2336F; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
nav.onglets {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--trait);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.onglets button {
  flex: 1; max-width: 150px; background: none; border: 0; cursor: pointer;
  color: var(--doux); padding: 8px 2px 9px; font: 600 12.5px var(--titre); letter-spacing: .02em;
  display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
}
nav.onglets svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.onglets button[aria-current="page"] { color: var(--encre); }
nav.onglets button[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px;
  background: var(--piste);
}
h1 { font: 700 30px/1.1 var(--titre); margin: 0; }
h2 { font: 700 21px/1.2 var(--titre); margin: 0 0 6px; }
h3 { font: 700 19px/1.2 var(--titre); margin: 0 0 4px; }
p { margin: 0 0 8px; }
a { color: var(--eau); }
.tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.sous { color: var(--doux); }
.petit { font-size: 14px; }
.vide { color: var(--doux); padding: 24px 0; }
.charge { color: var(--doux); }
.btn {
  font: 600 15px var(--texte); border-radius: 8px; border: 2px solid var(--encre);
  background: var(--encre); color: var(--fond); padding: 8px 16px; cursor: pointer; min-height: 42px;
}
.btn.sec { background: transparent; color: var(--encre); }
.btn.ok { background: var(--vert); border-color: var(--vert); color: #fff; }
.btn:disabled { opacity: .5; cursor: wait; }
.lien-btn { background: none; border: 0; padding: 0; color: var(--eau); font: inherit; cursor: pointer; text-decoration: underline; }
.lien-btn.danger { color: var(--piste); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid var(--eau); outline-offset: 2px;
}
.badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--piste); color: #fff; font: 700 12px var(--texte); }
.etiquette { display: inline-block; font: 600 13px var(--titre); letter-spacing: .03em; padding: 1px 8px; border-radius: 4px; background: var(--trait); color: var(--encre); margin-right: 6px; }
.etiquette.nouveau { background: var(--piste); color: #fff; }
.etiquette.eau { background: var(--eau-pale); color: var(--eau); }
.etiquette.piste { background: var(--piste-pale); color: var(--piste); }

/* Listes éditoriales plutôt que cartes */
.fil > * { padding: 16px 0; border-bottom: 1px solid var(--trait); }
.fil > *:first-child { padding-top: 0; }
.annonce.epinglee { border-left: 4px solid var(--piste); padding-left: 14px; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; font-size: 14px; color: var(--doux); }

/* Formulaires */
.formulaire { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 18px; margin-bottom: 22px; display: grid; gap: 12px; }
.formulaire label { display: grid; gap: 4px; font-weight: 500; font-size: 15px; }
.formulaire .case { display: flex; align-items: center; gap: 8px; }
.deux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .deux { grid-template-columns: 1fr; } }
input, select, textarea {
  font: 16px var(--texte); color: var(--encre); background: var(--fond);
  border: 1px solid var(--trait); border-radius: 8px; padding: 9px 10px; width: 100%;
}
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--eau); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.alerte .etiquette.piste { background: var(--piste); color: #fff; }
.alerte .etiquette.eau { background: var(--eau); color: #fff; }
.alerte { background: var(--piste-pale); border-left: 4px solid var(--piste); padding: 10px 12px; border-radius: 0 8px 8px 0; margin-bottom: 8px; }
.encart { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 22px; }

/* Calendrier des courses : l'élément signature */
.mois { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.mois h2 { margin: 0; font-size: 26px; text-transform: none; }
.mois .nav-mois { display: flex; gap: 6px; }
.mois .nav-mois button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--trait); background: var(--surface); color: var(--encre); font-size: 20px; cursor: pointer; }
.cal-tete, .cal-grille { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-tete span { font: 600 13px var(--titre); color: var(--doux); padding-bottom: 4px; }
.jour {
  aspect-ratio: 1 / 1; border: 0; border-radius: 10px; background: var(--surface); color: var(--encre);
  font: 600 17px var(--titre); cursor: pointer; position: relative; display: grid; place-items: center;
}
.jour.auj span { color: var(--eau); text-decoration: underline; text-underline-offset: 3px; }
.jour.sel { background: var(--route); color: #fff; }
.jour.sel span { color: #fff; }
.jour .pastille { position: absolute; bottom: 14%; width: 7px; height: 7px; border-radius: 50%; background: var(--piste); }
.jour.course { box-shadow: inset 0 0 0 2px var(--piste-pale); }
.jour-titre { margin: 22px 0 8px; font: 700 22px var(--titre); }
.jour-titre::first-letter { text-transform: uppercase; }
.course { padding: 14px 0 16px; border-bottom: 1px solid var(--trait); }
.format { display: inline-block; font: 600 14px var(--titre); border: 1.5px solid var(--encre); border-radius: 4px; padding: 0 7px; margin: 0 5px 5px 0; }
.participer { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.participer select { width: auto; min-width: 90px; }
.participer .ok { color: var(--vert); font-weight: 600; margin: 0; }
details summary { cursor: pointer; color: var(--doux); font-size: 15px; }
.noms { margin: 6px 0 4px; padding-left: 18px; }
.a-venir { margin-top: 26px; }
.a-venir button { display: flex; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--trait); padding: 10px 0; cursor: pointer; color: var(--encre); font: inherit; }
.a-venir .date-court { font: 700 16px var(--titre); min-width: 54px; color: var(--piste); }

/* Entraînements : la couleur suit la discipline */
.seance { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 10px 0 10px 12px; border-left: 4px solid var(--trait); margin-bottom: 8px; background: var(--surface); border-radius: 0 8px 8px 0; }
.seance.eau { border-left-color: var(--eau); }
.seance.route { border-left-color: var(--doux); }
.seance.piste { border-left-color: var(--piste); }
.seance .heure { font: 700 17px var(--titre); }
.seance.masque { opacity: .55; }
.jour-bloc { margin-bottom: 18px; }

/* Sondages */
.sondage { background: var(--surface); border: 1px solid var(--trait); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.option { display: block; width: 100%; text-align: left; position: relative; overflow: hidden; border: 1.5px solid var(--trait); border-radius: 8px; background: var(--fond); color: var(--encre); padding: 10px 12px; margin: 8px 0 0; font: inherit; cursor: pointer; }
.option[disabled] { cursor: default; }
.option.choisie { border-color: var(--eau); }
.option .barre-res { position: absolute; inset: 0 auto 0 0; background: var(--eau-pale); z-index: 0; }
.option .ligne { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 10px; }
.option .coche { font-weight: 700; color: var(--eau); }
.option .qui { position: relative; z-index: 1; font-size: 13.5px; color: var(--doux); display: block; margin-top: 2px; }

.membre { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--trait); }
.membre .actions { gap: 6px; }
.membre .btn { min-height: 36px; padding: 5px 12px; font-size: 14px; }
section + section { margin-top: 28px; }

#toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--encre); color: var(--fond); padding: 10px 16px; border-radius: 8px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 50;
}
#toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.erreur { background: var(--piste); color: #fff; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header class="barre">
  <div class="barre-int">
    <h1 id="club"><img src="logo.png" alt="Cahors Triathlon" width="122" height="40"></h1>
    <button id="btn-compte" type="button">Se connecter</button>
  </div>
</header>

<main id="main" tabindex="-1"><p class="charge">Chargement…</p></main>

<nav class="onglets" aria-label="Rubriques">
  <button data-onglet="accueil"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>Annonces</button>
  <button data-onglet="courses"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/></svg>Courses</button>
  <button data-onglet="entrainements"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M10 3h4"/></svg>Entraînements</button>
  <button data-onglet="sondages"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>Sondages</button>
  <button data-onglet="club"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16.5v-5M12 8h.01"/></svg>Club</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   CONFIGURATION : à compléter avec les informations de ton projet
   Supabase (bouton « Connect » du tableau de bord).
   Ne JAMAIS mettre ici la clé « service_role » / « secret ».
   ===================================================================== */
const CONFIG = {
  url: 'https://ehluvrwdeigbzykyopui.supabase.co',
  cle: 'sb_publishable_kZvdTTbvpRkJ7GbRE_QU1w_EeN50GWs',
  nomClub: 'Cahors Triathlon'
};

/* ---------- Outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escBr = v => esc(v).replace(/\n/g, '<br>');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtJour = s => parseYmd(s).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtCourt = s => parseYmd(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const fmtDateHeure = iso => new Date(iso).toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
const fmtHeure = t => t ? t.slice(0, 5).replace(':', 'h') : '';
const majuscule = s => s.charAt(0).toUpperCase() + s.slice(1);
const lienSur = url => { try { const u = new URL(url); return u.protocol === 'https:' ? u : null; } catch { return null; } };
const JOURS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const lire = k => { try { return localStorage.getItem(k); } catch { return null; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, v); } catch { } };
const donnees = f => Object.fromEntries(new FormData(f).entries());

async function q(requete) {
  const { data, error } = await requete;
  if (error) throw error;
  return data;
}

function messageErreur(e) {
  const t = (e && (e.message || e.error_description)) || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(t)) return 'Connexion impossible. Vérifiez votre accès à Internet.';
  if (/row-level security|permission denied/i.test(t)) return "Vous n'avez pas les droits pour cette action.";
  if (/duplicate key/i.test(t)) return 'Cet élément existe déjà.';
  if (/Signups not allowed/i.test(t)) return 'Aucun compte avec cette adresse. Choisissez « Créer mon compte ».';
  if (/rate limit|security purposes/i.test(t)) return 'Trop de demandes de code. Patientez quelques minutes avant de réessayer.';
  if (/(token|otp).*(expired|invalid)|(expired|invalid).*(token|otp)/i.test(t)) return 'Code incorrect ou expiré. Demandez un nouveau code.';
  return t;
}

let minuteurToast;
function toast(msg, erreur = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'visible' + (erreur ? ' erreur' : '');
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => t.className = '', erreur ? 5000 : 2600);
}
const erreur = e => { console.error(e); toast(messageErreur(e), true); };

async function occupe(bouton, action) {
  if (bouton) bouton.disabled = true;
  try { await action(); } catch (e) { erreur(e); } finally { if (bouton) bouton.disabled = false; }
}

/* ---------- État ---------- */
let sb;
const auj0 = new Date();
const S = {
  session: null, profil: null, onglet: 'accueil',
  mois: new Date(auj0.getFullYear(), auj0.getMonth(), 1), jour: ymd(auj0),
  connexion: { mode: 'connexion', email: null }, sondages: null
};
const estValide = () => S.profil?.statut === 'valide';
const estBureau = () => estValide() && S.profil.role === 'bureau';

async function chargerProfil() {
  S.profil = null;
  if (!S.session) return;
  try {
    S.profil = await q(sb.from('profils').select('*').eq('id', S.session.user.id).maybeSingle());
  } catch (e) { erreur(e); }
}

/* ---------- Rendu général ---------- */
function aller(onglet) { S.onglet = onglet; rendre(); window.scrollTo(0, 0); }

async function rendre() {
  document.querySelectorAll('nav.onglets button').forEach(b => {
    if (b.dataset.onglet === S.onglet) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const bc = $('#btn-compte');
  bc.textContent = S.session ? (S.profil?.prenom || 'Mon compte') : 'Se connecter';
  if (estBureau()) {
    sb.from('profils').select('id', { count: 'exact', head: true }).eq('statut', 'en_attente')
      .then(({ count }) => { if (count) bc.insertAdjacentHTML('beforeend', `<span class="badge" title="Demandes en attente">${count}</span>`); });
  }
  const m = $('#main');
  m.onclick = m.onsubmit = m.onchange = null;
  m.innerHTML = '<p class="charge">Chargement…</p>';
  try {
    await VUES[S.onglet](m);
  } catch (e) {
    erreur(e);
    m.innerHTML = '<p class="vide">Impossible d\'afficher cette rubrique. Vérifiez votre connexion, puis touchez à nouveau l\'onglet.</p>';
  }
}

function garde(m) {
  if (!S.session) {
    m.innerHTML = `<div class="encart"><h2>Réservé aux licenciés</h2>
      <p>Connectez-vous pour accéder à cette rubrique.</p>
      <button class="btn" type="button" data-aller="profil">Se connecter</button></div>`;
    m.onclick = e => { if (e.target.closest('[data-aller]')) aller('profil'); };
    return false;
  }
  if (!S.profil || S.profil.statut === 'en_attente') {
    m.innerHTML = `<div class="encart"><h2>Compte en attente de validation</h2>
      <p>Le bureau du club doit valider votre compte avant que vous puissiez accéder à cette rubrique. En attendant, les horaires d'entraînement et les coordonnées du club sont consultables.</p></div>`;
    return false;
  }
  if (S.profil.statut === 'desactive') {
    m.innerHTML = `<div class="encart"><h2>Compte désactivé</h2>
      <p>Votre accès a été désactivé. Contactez le bureau du club si vous pensez qu'il s'agit d'une erreur.</p></div>`;
    return false;
  }
  return true;
}

function zoneForm(m, html) {
  const z = $('#zone-form', m);
  z.innerHTML = html;
  const premier = z.querySelector('input, textarea, select');
  z.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (premier) setTimeout(() => premier.focus({ preventScroll: true }), 250);
}

/* =====================================================================
   ANNONCES
   ===================================================================== */
async function vueAccueil(m) {
  if (!garde(m)) return;
  const annonces = await q(sb.from('annonces').select('*')
    .order('epinglee', { ascending: false }).order('publiee_le', { ascending: false }));
  const vu = new Date(lire('annonces_vues') || 0);
  ecrire('annonces_vues', new Date().toISOString());
  const now = new Date();

  m.innerHTML = `
    <div class="tete"><h1>Annonces</h1>
      ${estBureau() ? '<button class="btn" type="button" data-action="nouvelle">Publier une annonce</button>' : ''}</div>
    <div id="zone-form"></div>
    ${annonces.length ? '' : '<p class="vide">Aucune annonce pour le moment.</p>'}
    <div class="fil">${annonces.map(a => {
      const expiree = a.expire_le && new Date(a.expire_le) <= now;
      return `<article class="annonce ${a.epinglee ? 'epinglee' : ''}">
        <div class="meta">
          ${a.epinglee ? '<span class="etiquette">Épinglée</span>' : ''}
          ${new Date(a.publiee_le) > vu ? '<span class="etiquette nouveau">Nouveau</span>' : ''}
          ${expiree ? '<span class="etiquette">Retirée (visible par le bureau seulement)</span>' : ''}
          <time>${esc(majuscule(fmtDateHeure(a.publiee_le)))}</time>
        </div>
        <h2>${esc(a.titre)}</h2>
        <p>${escBr(a.contenu)}</p>
        ${estBureau() ? `<button class="lien-btn danger" type="button" data-suppr="${esc(a.id)}">Supprimer</button>` : ''}
      </article>`;
    }).join('')}</div>`;

  m.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.action === 'nouvelle') zoneForm(m, `
      <form class="formulaire" id="f-annonce">
        <h2>Nouvelle annonce</h2>
        <label>Titre<input name="titre" required maxlength="120"></label>
        <label>Texte<textarea name="contenu" required rows="5"></textarea></label>
        <label class="case"><input type="checkbox" name="epinglee"> Épingler en haut de la liste</label>
        <label>Retirer automatiquement après le (facultatif)<input type="date" name="expire"></label>
        <div class="actions"><button class="btn">Publier</button><button type="button" class="btn sec" data-annuler>Annuler</button></div>
      </form>`);
    if (b.hasAttribute('data-annuler')) $('#zone-form', m).innerHTML = '';
    if (b.dataset.suppr && confirm('Supprimer définitivement cette annonce ?'))
      occupe(b, async () => { await q(sb.from('annonces').delete().eq('id', b.dataset.suppr)); toast('Annonce supprimée'); rendre(); });
  };
  m.onsubmit = e => {
    e.preventDefault();
    const d = donnees(e.target);
    occupe(e.submitter, async () => {
      let expire_le = null;
      if (d.expire) { const j = parseYmd(d.expire); j.setHours(23, 59, 59); expire_le = j.toISOString(); }
      await q(sb.from('annonces').insert({ titre: d.titre.trim(), contenu: d.contenu.trim(), epinglee: !!d.epinglee, expire_le }));
      toast('Annonce publiée');
      rendre();
    });
  };
}

/* =====================================================================
   COURSES
   ===================================================================== */
async function vueCourses(m) {
  if (!garde(m)) return;
  const y = S.mois.getFullYear(), mo = S.mois.getMonth();
  const debut = ymd(new Date(y, mo, 1)), fin = ymd(new Date(y, mo + 1, 0));
  const courses = await q(sb.from('courses').select('*, createur:profils(prenom, nom)')
    .lte('date_debut', fin).or(`date_fin.gte.${debut},date_debut.gte.${debut}`).order('date_debut'));

  const parJour = {};
  for (const c of courses) {
    const d = parseYmd(c.date_debut), f = parseYmd(c.date_fin || c.date_debut);
    while (d <= f) { (parJour[ymd(d)] ||= []).push(c); d.setDate(d.getDate() + 1); }
  }
  const duJour = parJour[S.jour] || [];
  const parts = duJour.length
    ? await q(sb.from('participations').select('course_id, format, profil_id, profils(prenom, nom)').in('course_id', duJour.map(c => c.id)))
    : [];

  const premier = new Date(y, mo, 1);
  const decalage = (premier.getDay() + 6) % 7;
  const nb = new Date(y, mo + 1, 0).getDate();
  const aujourdhui = ymd(new Date());
  let cases = '';
  for (let i = 0; i < decalage; i++) cases += '<span></span>';
  for (let j = 1; j <= nb; j++) {
    const k = ymd(new Date(y, mo, j));
    const n = (parJour[k] || []).length;
    cases += `<button type="button" class="jour ${k === aujourdhui ? 'auj' : ''} ${k === S.jour ? 'sel' : ''} ${n ? 'course' : ''}"
      data-jour="${k}" aria-pressed="${k === S.jour}" aria-label="${esc(fmtJour(k))}${n ? `, ${n} course${n > 1 ? 's' : ''}` : ''}">
      <span>${j}</span>${n ? '<i class="pastille"></i>' : ''}</button>`;
  }

  m.innerHTML = `
    <div class="tete"><h1>Courses</h1><button class="btn" type="button" data-action="ajouter">Ajouter une course</button></div>
    <div id="zone-form"></div>
    <div class="mois">
      <h2>${esc(majuscule(premier.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })))}</h2>
      <div class="nav-mois">
        <button type="button" data-mois="-1" aria-label="Mois précédent">‹</button>
        <button type="button" data-mois="1" aria-label="Mois suivant">›</button>
      </div>
    </div>
    <div class="cal-tete" aria-hidden="true">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(j => `<span>${j}</span>`).join('')}</div>
    <div class="cal-grille">${cases}</div>
    <p class="jour-titre">${esc(fmtJour(S.jour))}</p>
    ${duJour.length ? duJour.map(c => carteCourse(c, parts)).join('') : '<p class="sous">Aucune course ce jour-là. Touchez une date marquée d\'une pastille, ou ajoutez une course.</p>'}
    ${courses.length ? `<div class="a-venir"><h3>Ce mois-ci</h3>${courses.map(c => `
      <button type="button" data-jour="${c.date_debut < debut ? debut : esc(c.date_debut)}">
        <span class="date-court">${esc(fmtCourt(c.date_debut))}</span><span>${esc(c.nom)}${c.lieu ? ` <span class="sous">${esc(c.lieu)}</span>` : ''}</span>
      </button>`).join('')}</div>` : ''}`;

  m.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.jour) { S.jour = b.dataset.jour; rendre(); return; }
    if (b.dataset.mois) {
      S.mois = new Date(y, mo + Number(b.dataset.mois), 1);
      const ceMois = new Date();
      S.jour = (S.mois.getFullYear() === ceMois.getFullYear() && S.mois.getMonth() === ceMois.getMonth()) ? ymd(ceMois) : ymd(S.mois);
      rendre(); return;
    }
    if (b.dataset.action === 'ajouter') { zoneForm(m, formCourse(null)); verifierDoublons(m, null); return; }
    if (b.hasAttribute('data-annuler')) { $('#zone-form', m).innerHTML = ''; return; }
    if (b.dataset.modifier) {
      const c = courses.find(x => x.id === b.dataset.modifier);
      zoneForm(m, formCourse(c)); return;
    }
    if (b.dataset.supprimer && confirm('Supprimer cette course du calendrier ? Les participations associées seront aussi supprimées.'))
      return occupe(b, async () => { await q(sb.from('courses').delete().eq('id', b.dataset.supprimer)); toast('Course supprimée'); rendre(); });
    if (b.dataset.participer) {
      const sel = m.querySelector(`select[data-format-pour="${b.dataset.participer}"]`);
      return occupe(b, async () => {
        await q(sb.from('participations').insert({ course_id: b.dataset.participer, format: sel ? sel.value : null }));
        toast('Participation enregistrée'); rendre();
      });
    }
    if (b.dataset.quitter)
      return occupe(b, async () => {
        await q(sb.from('participations').delete().eq('course_id', b.dataset.quitter).eq('profil_id', S.profil.id));
        toast('Participation retirée'); rendre();
      });
  };
  m.onchange = e => { if (e.target.name === 'date_debut') verifierDoublons(m, e.target.form.dataset.id || null); };
  m.onsubmit = e => {
    e.preventDefault();
    const f = e.target, d = donnees(f);
    const lien = d.lien.trim();
    if (lien && !lienSur(lien)) return toast('Le lien doit commencer par https://', true);
    if (d.date_fin && d.date_fin < d.date_debut) return toast('Le dernier jour doit être après le premier.', true);
    const ligne = {
      nom: d.nom.trim(), lieu: d.lieu.trim() || null, date_debut: d.date_debut,
      date_fin: d.date_fin && d.date_fin !== d.date_debut ? d.date_fin : null,
      formats: d.formats.split(',').map(x => x.trim()).filter(Boolean),
      lien_inscription: lien || null, description: d.description.trim() || null
    };
    occupe(e.submitter, async () => {
      if (f.dataset.id) await q(sb.from('courses').update(ligne).eq('id', f.dataset.id));
      else await q(sb.from('courses').insert(ligne));
      toast(f.dataset.id ? 'Course modifiée' : 'Course ajoutée');
      S.jour = ligne.date_debut;
      const dd = parseYmd(ligne.date_debut); S.mois = new Date(dd.getFullYear(), dd.getMonth(), 1);
      rendre();
    });
  };
}

function carteCourse(c, parts) {
  const inscrits = parts.filter(p => p.course_id === c.id);
  const moi = inscrits.find(p => p.profil_id === S.profil.id);
  const lien = c.lien_inscription && lienSur(c.lien_inscription);
  const peutModifier = estBureau() || c.cree_par === S.profil.id;
  const dates = c.date_fin ? `Du ${fmtJour(c.date_debut)} au ${fmtJour(c.date_fin)}` : majuscule(fmtJour(c.date_debut));
  return `<article class="course">
    <h3>${esc(c.nom)}</h3>
    <p class="sous">${esc(dates)}${c.lieu ? `, ${esc(c.lieu)}` : ''}</p>
    ${c.formats?.length ? `<p>${c.formats.map(f => `<span class="format">${esc(f)}</span>`).join('')}</p>` : ''}
    ${c.description ? `<p>${escBr(c.description)}</p>` : ''}
    ${lien ? `<p><a href="${esc(lien.href)}" target="_blank" rel="noopener noreferrer">Inscription officielle sur ${esc(lien.hostname)}</a></p>` : ''}
    <div class="participer">${moi
      ? `<p class="ok">Vous participez${moi.format ? ` en ${esc(moi.format)}` : ''}.</p>
         <button class="btn sec" type="button" data-quitter="${esc(c.id)}">Je ne participe plus</button>`
      : `${c.formats?.length ? `<select data-format-pour="${esc(c.id)}" aria-label="Format choisi">${c.formats.map(f => `<option>${esc(f)}</option>`).join('')}</select>` : ''}
         <button class="btn" type="button" data-participer="${esc(c.id)}">Je participe</button>`}
    </div>
    <details ${inscrits.length && inscrits.length <= 8 ? 'open' : ''}><summary>${inscrits.length} licencié${inscrits.length > 1 ? 's' : ''} du club inscrit${inscrits.length > 1 ? 's' : ''}</summary>
      <ul class="noms">${inscrits.map(p => `<li>${p.profils ? esc(p.profils.prenom + ' ' + p.profils.nom) : 'Ancien membre'}${p.format ? ` <span class="sous">(${esc(p.format)})</span>` : ''}</li>`).join('') || '<li class="sous">Personne pour le moment.</li>'}</ul>
    </details>
    <p class="sous petit">Ajoutée par ${c.createur ? esc(c.createur.prenom + ' ' + c.createur.nom) : 'un ancien membre'}
      ${peutModifier ? `<button class="lien-btn" type="button" data-modifier="${esc(c.id)}">Modifier</button>
      <button class="lien-btn danger" type="button" data-supprimer="${esc(c.id)}">Supprimer</button>` : ''}</p>
  </article>`;
}

function formCourse(c) {
  return `<form class="formulaire" ${c ? `data-id="${esc(c.id)}"` : ''}>
    <h2>${c ? 'Modifier la course' : 'Ajouter une course'}</h2>
    <label>Nom de la course<input name="nom" required maxlength="120" value="${esc(c?.nom)}"></label>
    <label>Lieu<input name="lieu" maxlength="120" value="${esc(c?.lieu)}"></label>
    <div class="deux">
      <label>Date<input type="date" name="date_debut" required value="${esc(c?.date_debut || S.jour)}"></label>
      <label>Dernier jour, si plusieurs jours<input type="date" name="date_fin" value="${esc(c?.date_fin)}"></label>
    </div>
    <div id="doublons"></div>
    <label>Formats, séparés par des virgules<input name="formats" placeholder="XS, S, M, Relais" value="${esc((c?.formats || []).join(', '))}"></label>
    <label>Lien vers l'inscription officielle<input type="url" name="lien" placeholder="https://…" value="${esc(c?.lien_inscription)}"></label>
    <label>Informations utiles<textarea name="description" rows="3">${esc(c?.description)}</textarea></label>
    <div class="actions"><button class="btn">${c ? 'Enregistrer' : 'Ajouter la course'}</button>
      <button type="button" class="btn sec" data-annuler>Annuler</button></div>
  </form>`;
}

async function verifierDoublons(m, idCourant) {
  const champ = m.querySelector('input[name="date_debut"]'), zone = $('#doublons', m);
  if (!champ || !zone || !champ.value) return;
  try {
    let r = sb.from('courses').select('id, nom').lte('date_debut', champ.value)
      .or(`date_fin.gte.${champ.value},date_debut.eq.${champ.value}`);
    const existantes = (await q(r)).filter(c => c.id !== idCourant);
    zone.innerHTML = existantes.length
      ? `<p class="alerte">Déjà au calendrier ce jour-là : ${existantes.map(c => esc(c.nom)).join(', ')}. Vérifiez qu'il ne s'agit pas de la même course.</p>` : '';
  } catch { zone.innerHTML = ''; }
}

/* =====================================================================
   ENTRAÎNEMENTS (consultables sans connexion)
   ===================================================================== */
function couleurDiscipline(d) {
  const t = (d || '').toLowerCase();
  if (/nat|piscine|eau|swim/.test(t)) return 'eau';
  if (/v[ée]lo|cyclo|vtt|home.?trainer/.test(t)) return 'route';
  if (/course|cap|run|piste|trail/.test(t)) return 'piste';
  return '';
}

async function vueEntrainements(m) {
  const auj = ymd(new Date());
  const [creneaux, modifs] = await Promise.all([
    q(sb.from('creneaux').select('*').order('jour').order('heure_debut')),
    q(sb.from('modifs_entrainement').select('*, creneaux(jour, heure_debut, discipline)').gte('date', auj).order('date'))
  ]);
  const enVigueur = c => c.actif && (!c.valide_du || c.valide_du <= auj) && (!c.valide_au || c.valide_au >= auj);
  const visibles = creneaux.filter(c => estBureau() || enVigueur(c));
  const libelleType = { annulation: 'Annulé', changement: 'Changement', info: 'Info' };

  let parJour = '';
  for (let j = 1; j <= 7; j++) {
    const duJour = visibles.filter(c => c.jour === j);
    if (!duJour.length) continue;
    parJour += `<div class="jour-bloc"><h2>${JOURS[j - 1]}</h2>${duJour.map(c => `
      <div class="seance ${couleurDiscipline(c.discipline)} ${enVigueur(c) ? '' : 'masque'}">
        <div class="heure">${fmtHeure(c.heure_debut)}${c.heure_fin ? `<br><span class="sous petit">à ${fmtHeure(c.heure_fin)}</span>` : ''}</div>
        <div><strong>${esc(c.discipline)}</strong>
          ${c.lieu ? `<br>${esc(c.lieu)}` : ''}
          ${c.encadrant ? `<br><span class="sous">Avec ${esc(c.encadrant)}</span>` : ''}
          ${c.valide_du || c.valide_au ? `<br><span class="sous petit">${c.valide_du ? `Du ${esc(fmtCourt(c.valide_du))} ` : ''}${c.valide_au ? `jusqu'au ${esc(fmtCourt(c.valide_au))}` : ''}</span>` : ''}
          ${estBureau() ? `<br>${enVigueur(c) ? '' : '<span class="sous petit">Masqué aux licenciés. </span>'}<button class="lien-btn danger" type="button" data-suppr-creneau="${esc(c.id)}">Supprimer</button>` : ''}
        </div>
      </div>`).join('')}</div>`;
  }

  m.innerHTML = `
    <div class="tete"><h1>Entraînements</h1>
      ${estBureau() ? `<div class="actions"><button class="btn" type="button" data-action="creneau">Ajouter un créneau</button>
        <button class="btn sec" type="button" data-action="modif">Signaler un changement</button></div>` : ''}</div>
    <div id="zone-form"></div>
    ${modifs.length ? `<section><h2>Changements à venir</h2>${modifs.map(x => `
      <div class="alerte"><span class="etiquette ${x.type === 'annulation' ? 'piste' : 'eau'}">${libelleType[x.type]}</span>
        <strong>${esc(majuscule(fmtJour(x.date)))}</strong>${x.creneaux ? `, ${esc(x.creneaux.discipline)} de ${fmtHeure(x.creneaux.heure_debut)}` : ''}
        <p>${escBr(x.message)}</p>
        ${estBureau() ? `<button class="lien-btn danger" type="button" data-suppr-modif="${esc(x.id)}">Supprimer</button>` : ''}
      </div>`).join('')}</section>` : ''}
    <section>${parJour || '<p class="vide">Les horaires d\'entraînement ne sont pas encore en ligne.</p>'}</section>`;

  m.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-annuler')) { $('#zone-form', m).innerHTML = ''; return; }
    if (b.dataset.action === 'creneau') zoneForm(m, `
      <form class="formulaire" data-type="creneau">
        <h2>Nouveau créneau</h2>
        <label>Jour<select name="jour">${JOURS.map((j, i) => `<option value="${i + 1}">${j}</option>`).join('')}</select></label>
        <div class="deux"><label>Début<input type="time" name="heure_debut" required></label><label>Fin<input type="time" name="heure_fin"></label></div>
        <label>Discipline<input name="discipline" required list="disciplines" maxlength="60">
          <datalist id="disciplines"><option>Natation</option><option>Vélo</option><option>Course à pied</option><option>Enchaînement</option><option>Préparation physique</option></datalist></label>
        <label>Lieu<input name="lieu" maxlength="120"></label>
        <label>Encadrant<input name="encadrant" maxlength="80"></label>
        <div class="deux"><label>Valable à partir du (facultatif)<input type="date" name="valide_du"></label><label>Jusqu'au (facultatif)<input type="date" name="valide_au"></label></div>
        <div class="actions"><button class="btn">Ajouter le créneau</button><button type="button" class="btn sec" data-annuler>Annuler</button></div>
      </form>`);
    if (b.dataset.action === 'modif') zoneForm(m, `
      <form class="formulaire" data-type="modif">
        <h2>Signaler un changement</h2>
        <label>Date<input type="date" name="date" required value="${auj}"></label>
        <label>Créneau concerné<select name="creneau_id"><option value="">Tout le club</option>
          ${creneaux.filter(enVigueur).map(c => `<option value="${esc(c.id)}">${JOURS[c.jour - 1]} ${fmtHeure(c.heure_debut)}, ${esc(c.discipline)}</option>`).join('')}</select></label>
        <label>Type<select name="type"><option value="annulation">Annulation</option><option value="changement">Changement (lieu, horaire…)</option><option value="info">Information</option></select></label>
        <label>Message<textarea name="message" required rows="3"></textarea></label>
        <div class="actions"><button class="btn">Publier le changement</button><button type="button" class="btn sec" data-annuler>Annuler</button></div>
      </form>`);

    if (b.dataset.supprModif && confirm('Supprimer ce changement ?'))
      occupe(b, async () => { await q(sb.from('modifs_entrainement').delete().eq('id', b.dataset.supprModif)); toast('Changement supprimé'); rendre(); });

          jour: Number(d.jour), heure_debut: d.heure_debut, heure_fin: d.heure_fin || null,

          valide_du: d.valide_du || null, valide_au: d.valide_au || null

        toast('Créneau ajouté');

        await q(sb.from('modifs_entrainement').insert({ date: d.date, creneau_id: d.creneau_id || null, type: d.type, message: d.message.trim() }));
        toast('Changement publié');
      }
      rendre();
    });
  };
}

/* =====================================================================
   SONDAGES

async function vueSondages(m) {
  if (!garde(m)) return;
  const sondages = await q(sb.from('sondages').select('*').order('cloture_le'));
  const ids = sondages.map(s => s.id);
  let options = [], votes = [];
  if (ids.length) [options, votes] = await Promise.all([
    q(sb.from('options_sondage').select('*').in('sondage_id', ids).order('ordre')),
    q(sb.from('votes').select('sondage_id, option_id, profil_id, profils(prenom, nom)').in('sondage_id', ids))
  ]);
  const now = new Date();
  const etat = s => new Date(s.ouvert_le) > now ? 'avenir' : new Date(s.cloture_le) <= now ? 'clos' : 'ouvert';
  const ouverts = sondages.filter(s => etat(s) === 'ouvert');
  const avenir = sondages.filter(s => etat(s) === 'avenir');
  const clos = sondages.filter(s => etat(s) === 'clos').reverse();

  const carte = s => {
    const et = etat(s);
    const opts = options.filter(o => o.sondage_id === s.id);
    const vs = votes.filter(v => v.sondage_id === s.id);
    const miens = new Set(vs.filter(v => v.profil_id === S.profil.id).map(v => v.option_id));
    const visible = estBureau() || s.visibilite_resultats === 'immediate' || et === 'clos' || (s.visibilite_resultats === 'apres_vote' && miens.size > 0);
    const votants = new Set(vs.map(v => v.profil_id)).size;
    return `<article class="sondage">
      <h2>${esc(s.question)}</h2>
      ${s.description ? `<p>${escBr(s.description)}</p>` : ''}
      <p class="sous petit">${et === 'ouvert' ? `Clôture ${esc(fmtDateHeure(s.cloture_le))}` : et === 'clos' ? `Clos depuis le ${esc(fmtDateHeure(s.cloture_le))}` : `Ouvre ${esc(fmtDateHeure(s.ouvert_le))}`}${s.choix_multiple ? '. Plusieurs choix possibles.' : '.'}</p>
      ${opts.map(o => {
        const pour = vs.filter(v => v.option_id === o.id);
        const pct = votants ? Math.round(pour.length / votants * 100) : 0;
        const choisie = miens.has(o.id);
        return `<button type="button" class="option ${choisie ? 'choisie' : ''}" ${et === 'ouvert' ? `data-voter="${esc(o.id)}" data-sondage="${esc(s.id)}"` : 'disabled'} aria-pressed="${choisie}">
          ${visible ? `<span class="barre-res" style="width:${pct}%"></span>` : ''}
          <span class="ligne"><span>${choisie ? '<span class="coche">✓</span> ' : ''}${esc(o.libelle)}</span>${visible ? `<span>${pour.length}</span>` : ''}</span>
          ${visible && pour.length ? `<span class="qui">${pour.map(v => v.profils ? esc(v.profils.prenom + ' ' + v.profils.nom) : 'Ancien membre').join(', ')}</span>` : ''}
        </button>`;
      }).join('')}
      <p class="sous petit" style="margin-top:10px">${visible ? `${votants} votant${votants > 1 ? 's' : ''}.` : s.visibilite_resultats === 'cloture' ? 'Résultats visibles à la clôture.' : 'Votez pour voir les résultats.'}
        ${et === 'ouvert' && miens.size ? ' Vous pouvez modifier votre choix jusqu\'à la clôture.' : ''}</p>
      ${estBureau() ? `<button class="lien-btn danger" type="button" data-suppr="${esc(s.id)}">Supprimer le sondage</button>` : ''}
    </article>`;
  };

  m.innerHTML = `
    <div class="tete"><h1>Sondages</h1>${estBureau() ? '<button class="btn" type="button" data-action="nouveau">Créer un sondage</button>' : ''}</div>
    <div id="zone-form"></div>
    <section>${ouverts.length ? ouverts.map(carte).join('') : '<p class="vide">Aucun sondage en cours.</p>'}</section>
    ${avenir.length ? `<section><h2>Bientôt</h2>${avenir.map(carte).join('')}</section>` : ''}
    ${clos.length ? `<section><h2>Sondages clos</h2>${clos.map(carte).join('')}</section>` : ''}`;

  m.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-annuler')) { $('#zone-form', m).innerHTML = ''; return; }
    if (b.dataset.action === 'nouveau') {
      const dans7 = new Date(); dans7.setDate(dans7.getDate() + 7);
      zoneForm(m, `<form class="formulaire">
        <h2>Nouveau sondage</h2>
        <label>Question<input name="question" required maxlength="200"></label>
        <label>Précisions (facultatif)<textarea name="description" rows="2"></textarea></label>
        <label>Réponses possibles, une par ligne<textarea name="options" required rows="4" placeholder="Samedi 14&#10;Dimanche 15"></textarea></label>
        <label class="case"><input type="checkbox" name="multiple"> Autoriser plusieurs choix</label>
        <label>Résultats visibles<select name="visibilite">
          <option value="apres_vote">Après avoir voté</option><option value="immediate">Tout de suite, par tous</option><option value="cloture">Seulement à la clôture</option></select></label>
        <label>Clôture le<input type="datetime-local" name="cloture" required value="${ymd(dans7)}T20:00"></label>
        <div class="actions"><button class="btn">Publier le sondage</button><button type="button" class="btn sec" data-annuler>Annuler</button></div>
      </form>`);
      return;
    }
    if (b.dataset.suppr && confirm('Supprimer ce sondage et tous ses votes ?'))
      return occupe(b, async () => { await q(sb.from('sondages').delete().eq('id', b.dataset.suppr)); toast('Sondage supprimé'); rendre(); });
    if (b.dataset.voter) {
      const s = sondages.find(x => x.id === b.dataset.sondage);
      const oid = b.dataset.voter;
      const miens = votes.filter(v => v.sondage_id === s.id && v.profil_id === S.profil.id).map(v => v.option_id);
      return occupe(b, async () => {
        if (miens.includes(oid)) {
          await q(sb.from('votes').delete().eq('option_id', oid).eq('profil_id', S.profil.id));
        } else {
          if (!s.choix_multiple && miens.length) await q(sb.from('votes').delete().eq('sondage_id', s.id).eq('profil_id', S.profil.id));
          await q(sb.from('votes').insert({ sondage_id: s.id, option_id: oid }));
        }
        rendre();
      });
    }
  };
  m.onsubmit = e => {
    e.preventDefault();
    const d = donnees(e.target);
    const libelles = d.options.split('\n').map(x => x.trim()).filter(Boolean);
    if (libelles.length < 2) return toast('Indiquez au moins deux réponses possibles.', true);
    const cloture = new Date(d.cloture);
    if (!(cloture > new Date())) return toast('La date de clôture doit être dans le futur.', true);
    occupe(e.submitter, async () => {
      const s = await q(sb.from('sondages').insert({
        question: d.question.trim(), description: d.description.trim() || null,
        choix_multiple: !!d.multiple, visibilite_resultats: d.visibilite, cloture_le: cloture.toISOString()
      }).select('id').single());
      try {
        await q(sb.from('options_sondage').insert(libelles.map((libelle, i) => ({ sondage_id: s.id, libelle, ordre: i }))));
      } catch (err) {
        await sb.from('sondages').delete().eq('id', s.id);
        throw err;
      }
      toast('Sondage publié');
      rendre();
    });
  };
}

/* =====================================================================
   CLUB : coordonnées et règlement intérieur
   ===================================================================== */
async function vueClub(m) {
  const info = (await q(sb.from('infos_club').select('*').eq('id', 1).maybeSingle())) || {};
  const lieux = Array.isArray(info.lieux) ? info.lieux : [];
  const site = info.site_web && lienSur(info.site_web);
  const carteLieu = l => {
    const l2 = l.lien_carte && lienSur(l.lien_carte);
    const href = l2 ? l2.href : (l.adresse ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(l.adresse) : null);
    return `<li><strong>${esc(l.nom)}</strong>${l.adresse ? `<br>${esc(l.adresse)}` : ''}${href ? `<br><a href="${esc(href)}" target="_blank" rel="noopener noreferrer">Voir sur une carte</a>` : ''}</li>`;
  };

  let ri;
  if (!info.ri_chemin) ri = '<p class="sous">Le règlement intérieur n\'est pas encore en ligne.</p>';
  else if (!estValide()) ri = '<p class="sous">Le règlement intérieur est accessible aux licenciés connectés.</p>';
  else {
    const accepte = info.ri_version && S.profil.ri_version_acceptee === info.ri_version;
    ri = `<p><button class="btn" type="button" data-action="ri">Consulter le règlement intérieur</button></p>
      <p class="sous petit">${info.ri_version ? `Version ${esc(info.ri_version)}` : ''}${info.ri_date ? ` du ${esc(fmtCourt(info.ri_date))}` : ''}</p>
      ${info.ri_version ? (accepte
        ? `<p class="sous petit">Vous en avez pris connaissance le ${esc(new Date(S.profil.ri_accepte_le).toLocaleDateString('fr-FR'))}.</p>`
        : `<form class="formulaire" data-type="accepter"><label class="case"><input type="checkbox" name="ok" required> J'ai pris connaissance du règlement intérieur.</label>
           <div class="actions"><button class="btn ok">Confirmer</button></div></form>`) : ''}`;
  }

  m.innerHTML = `
    <div class="tete"><h1>${esc(info.nom_club || CONFIG.nomClub)}</h1>
      ${estBureau() ? `<div class="actions"><button class="btn sec" type="button" data-action="modifier">Modifier les informations</button>
        <button class="btn sec" type="button" data-action="nouveau-ri">Mettre en ligne le règlement</button></div>` : ''}</div>
    <div id="zone-form"></div>
    <section><h2>Coordonnées</h2>
      ${info.adresse ? `<p>${escBr(info.adresse)}</p>` : ''}
      ${info.email ? `<p><a href="mailto:${esc(info.email)}">${esc(info.email)}</a></p>` : ''}
      ${info.telephone ? `<p><a href="tel:${esc(info.telephone.replace(/\s/g, ''))}">${esc(info.telephone)}</a></p>` : ''}
      ${site ? `<p><a href="${esc(site.href)}" target="_blank" rel="noopener noreferrer">${esc(site.hostname)}</a></p>` : ''}
      ${!info.adresse && !info.email && !info.telephone && !site ? '<p class="sous">Les coordonnées du club ne sont pas encore renseignées.</p>' : ''}
    </section>
    ${lieux.length ? `<section><h2>Lieux d'entraînement</h2><ul class="noms">${lieux.map(carteLieu).join('')}</ul></section>` : ''}
    <section><h2>Règlement intérieur</h2>${ri}</section>`;

  m.onclick = async e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-annuler')) { $('#zone-form', m).innerHTML = ''; return; }
    if (b.dataset.action === 'ri') {
      const fenetre = window.open('', '_blank');
      occupe(b, async () => {
        const r = await q(sb.storage.from('documents').createSignedUrl(info.ri_chemin, 600));
        if (fenetre) fenetre.location = r.signedUrl; else location.href = r.signedUrl;
      });
    }
    if (b.dataset.action === 'modifier') zoneForm(m, `
      <form class="formulaire" data-type="infos">
        <h2>Informations du club</h2>
        <label>Nom du club<input name="nom_club" value="${esc(info.nom_club)}"></label>
        <label>Adresse<textarea name="adresse" rows="2">${esc(info.adresse)}</textarea></label>
        <div class="deux"><label>E-mail<input type="email" name="email" value="${esc(info.email)}"></label>
          <label>Téléphone<input type="tel" name="telephone" value="${esc(info.telephone)}"></label></div>
        <label>Site web<input type="url" name="site_web" placeholder="https://…" value="${esc(info.site_web)}"></label>
        <label>Lieux d'entraînement, un par ligne : Nom | Adresse | Lien carte (facultatif)
          <textarea name="lieux" rows="4">${esc(lieux.map(l => [l.nom, l.adresse, l.lien_carte].filter(Boolean).join(' | ')).join('\n'))}</textarea></label>
        <div class="actions"><button class="btn">Enregistrer</button><button type="button" class="btn sec" data-annuler>Annuler</button></div>
      </form>`);
    if (b.dataset.action === 'nouveau-ri') zoneForm(m, `
      <form class="formulaire" data-type="ri">
        <h2>Nouveau règlement intérieur</h2>
        <label>Fichier PDF<input type="file" name="fichier" accept="application/pdf" required></label>
        <label>Numéro ou nom de version<input name="version" required placeholder="2026-1"></label>
        <p class="sous petit">Changer de version demande à chaque licencié de confirmer à nouveau sa prise de connaissance.</p>
        <div class="actions"><button class="btn">Mettre en ligne</button><button type="button" class="btn sec" data-annuler>Annuler</button></div>
      </form>`);
  };
  m.onsubmit = e => {
    e.preventDefault();
    const f = e.target, d = donnees(f);
    occupe(e.submitter, async () => {
      if (f.dataset.type === 'accepter') {
        await q(sb.from('profils').update({ ri_version_acceptee: info.ri_version, ri_accepte_le: new Date().toISOString() }).eq('id', S.profil.id));
        await chargerProfil();
        toast('Merci, c\'est enregistré');
      }
      if (f.dataset.type === 'infos') {
        if (d.site_web.trim() && !lienSur(d.site_web.trim())) throw new Error('Le site web doit commencer par https://');
        const lignes = d.lieux.split('\n').map(x => x.trim()).filter(Boolean).map(x => {
          const [nom, adresse, lien_carte] = x.split('|').map(y => (y || '').trim());
          return { nom, adresse: adresse || null, lien_carte: lien_carte || null };
        });
        await q(sb.from('infos_club').update({
          nom_club: d.nom_club.trim() || null, adresse: d.adresse.trim() || null, email: d.email.trim() || null,
          telephone: d.telephone.trim() || null, site_web: d.site_web.trim() || null, lieux: lignes, updated_at: new Date().toISOString()
        }).eq('id', 1));
        toast('Informations enregistrées');
      }
      if (f.dataset.type === 'ri') {
        const fichier = f.fichier.files[0];
        if (!fichier || fichier.type !== 'application/pdf') throw new Error('Choisissez un fichier PDF.');
        if (fichier.size > 10 * 1024 * 1024) throw new Error('Le fichier dépasse 10 Mo.');
        const chemin = `reglement/RI_${Date.now()}.pdf`;
        await q(sb.storage.from('documents').upload(chemin, fichier, { contentType: 'application/pdf' }));
        await q(sb.from('infos_club').update({ ri_chemin: chemin, ri_version: d.version.trim(), ri_date: ymd(new Date()) }).eq('id', 1));
        toast('Règlement mis en ligne');
      }
      rendre();
    });
  };
}

/* =====================================================================
   COMPTE : connexion par code, profil
   ===================================================================== */
async function vueProfil(m) {
  if (!S.session) return vueConnexion(m);
  const p = S.profil || {};
  const statut = { en_attente: 'En attente de validation par le bureau', valide: 'Compte validé', desactive: 'Compte désactivé' }[p.statut] || '';
  m.innerHTML = `
    <div class="tete"><h1>Mon compte</h1></div>
    <p><span class="etiquette ${p.statut === 'valide' ? 'eau' : 'piste'}">${esc(statut)}</span>${p.role === 'bureau' ? '<span class="etiquette">Bureau</span>' : ''}</p>
    <p class="sous">${esc(S.session.user.email)}</p>
    ${estBureau() ? '<p><button class="btn" type="button" data-action="gestion">Gérer les membres</button></p>' : ''}
    <form class="formulaire">
      <h2>Mes informations</h2>
      <div class="deux"><label>Prénom<input name="prenom" required maxlength="60" value="${esc(p.prenom)}"></label>
        <label>Nom<input name="nom" required maxlength="60" value="${esc(p.nom)}"></label></div>
      <label>Numéro de licence<input name="numero_licence" maxlength="30" value="${esc(p.numero_licence)}"></label>
      <div class="actions"><button class="btn">Enregistrer</button></div>
    </form>
    <button class="btn sec" type="button" data-action="deconnexion">Se déconnecter</button>`;
  m.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.action === 'gestion') aller('gestion');
    if (b.dataset.action === 'deconnexion') occupe(b, async () => { await sb.auth.signOut(); S.onglet = 'accueil'; });
  };
  m.onsubmit = e => {
    e.preventDefault();
    const d = donnees(e.target);
    occupe(e.submitter, async () => {
      await q(sb.from('profils').update({ prenom: d.prenom.trim(), nom: d.nom.trim(), numero_licence: d.numero_licence.trim() || null }).eq('id', S.session.user.id));
      await chargerProfil();
      toast('Informations enregistrées');
      rendre();
    });
  };
}

function vueConnexion(m) {
  const c = S.connexion;
  if (c.email) {
    m.innerHTML = `
      <div class="tete"><h1>Saisissez votre code</h1></div>
      <form class="formulaire" data-etape="code">
        <p>Un code vient d'être envoyé à <strong>${esc(c.email)}</strong>. Pensez à regarder dans les indésirables.</p>
        <label>Code reçu par e-mail<input name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10"></label>
        <div class="actions"><button class="btn">Me connecter</button><button type="button" class="btn sec" data-action="retour">Changer d'adresse</button></div>
      </form>`;
  } else {
    const inscription = c.mode === 'inscription';
    m.innerHTML = `
      <div class="tete"><h1>${inscription ? 'Créer mon compte' : 'Se connecter'}</h1></div>
      <form class="formulaire" data-etape="email">
        <p class="sous">Pas de mot de passe : vous recevez un code de connexion par e-mail.</p>
        <label>Adresse e-mail<input type="email" name="email" required autocomplete="email"></label>
        ${inscription ? `<div class="deux"><label>Prénom<input name="prenom" required maxlength="60" autocomplete="given-name"></label>
          <label>Nom<input name="nom" required maxlength="60" autocomplete="family-name"></label></div>
          <label>Numéro de licence (facilite la validation par le bureau)<input name="numero_licence" maxlength="30"></label>` : ''}
        <div class="actions"><button class="btn">Recevoir mon code</button></div>
      </form>
      <p>${inscription ? 'Vous avez déjà un compte ? ' : 'Première visite ? '}
        <button class="lien-btn" type="button" data-action="mode">${inscription ? 'Se connecter' : 'Créer mon compte'}</button></p>
      ${inscription ? '<p class="sous petit">Votre compte sera actif après validation par le bureau du club.</p>' : ''}`;
  }
  m.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.action === 'mode') { c.mode = c.mode === 'inscription' ? 'connexion' : 'inscription'; rendre(); }
    if (b.dataset.action === 'retour') { c.email = null; rendre(); }
  };
  m.onsubmit = e => {
    e.preventDefault();
    const f = e.target, d = donnees(f);
    occupe(e.submitter, async () => {
      if (f.dataset.etape === 'email') {
        const email = d.email.trim().toLowerCase();
        const inscription = c.mode === 'inscription';
        const { error } = await sb.auth.signInWithOtp({
          email,
          options: {
            shouldCreateUser: inscription,
            data: inscription ? { prenom: d.prenom.trim(), nom: d.nom.trim(), numero_licence: (d.numero_licence || '').trim() || null } : undefined
          }
        });
        if (error) throw error;
        c.email = email;
        rendre();
      } else {
        const { error } = await sb.auth.verifyOtp({ email: c.email, token: d.code.trim(), type: 'email' });
        if (error) throw error;
        c.email = null;
        S.onglet = 'accueil';
      }
    });
  };
}

/* =====================================================================
   GESTION DES MEMBRES (bureau)
   ===================================================================== */
async function vueGestion(m) {
  if (!estBureau()) { S.onglet = 'profil'; return vueProfil(m); }
  const membres = await q(sb.from('profils').select('*').order('nom').order('prenom'));
  const attente = membres.filter(p => p.statut === 'en_attente').sort((a, b) => a.created_at.localeCompare(b.created_at));
  const actifs = membres.filter(p => p.statut === 'valide');
  const inactifs = membres.filter(p => p.statut === 'desactive');
  const nom = p => esc(`${p.prenom} ${p.nom}`.trim() || 'Nom non renseigné');
  const ligne = (p, boutons) => `<div class="membre"><div><strong>${nom(p)}</strong>${p.role === 'bureau' ? ' <span class="etiquette">Bureau</span>' : ''}
      <br><span class="sous petit">${p.numero_licence ? `Licence ${esc(p.numero_licence)}. ` : 'Licence non renseignée. '}Inscrit le ${esc(new Date(p.created_at).toLocaleDateString('fr-FR'))}.</span></div>
      <div class="actions">${boutons}</div></div>`;

  m.innerHTML = `
    <div class="tete"><h1>Membres</h1><button class="btn sec" type="button" data-action="retour">Retour à mon compte</button></div>
    <section><h2>Demandes en attente ${attente.length ? `<span class="badge">${attente.length}</span>` : ''}</h2>
      ${attente.length ? attente.map(p => ligne(p, `
        <button class="btn ok" type="button" data-statut="valide" data-id="${esc(p.id)}">Valider</button>
        <button class="btn sec" type="button" data-statut="desactive" data-id="${esc(p.id)}">Refuser</button>`)).join('') : '<p class="sous">Aucune demande en attente.</p>'}
    </section>
    <section><h2>Licenciés actifs (${actifs.length})</h2>
      ${actifs.map(p => ligne(p, p.id === S.profil.id ? '<span class="sous petit">Vous</span>' : `
        <button class="btn sec" type="button" data-role="${p.role === 'bureau' ? 'licencie' : 'bureau'}" data-id="${esc(p.id)}">${p.role === 'bureau' ? 'Retirer du bureau' : 'Nommer au bureau'}</button>
        <button class="btn sec" type="button" data-statut="desactive" data-id="${esc(p.id)}">Désactiver</button>`)).join('')}
    </section>
    ${inactifs.length ? `<section><h2>Comptes désactivés ou refusés</h2>
      ${inactifs.map(p => ligne(p, `<button class="btn sec" type="button" data-statut="valide" data-id="${esc(p.id)}">Réactiver</button>`)).join('')}</section>` : ''}`;

  m.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.action === 'retour') return aller('profil');
    if (b.dataset.statut) {
      if (b.dataset.statut === 'desactive' && !confirm('Couper l\'accès de cette personne à l\'appli ?')) return;
      occupe(b, async () => {
        await q(sb.from('profils').update({ statut: b.dataset.statut }).eq('id', b.dataset.id));
        toast(b.dataset.statut === 'valide' ? 'Compte validé' : 'Accès coupé');
        rendre();
      });
    }
    if (b.dataset.role) {
      if (!confirm(b.dataset.role === 'bureau' ? 'Donner les droits du bureau à cette personne ?' : 'Retirer les droits du bureau à cette personne ?')) return;
      occupe(b, async () => {
        await q(sb.from('profils').update({ role: b.dataset.role }).eq('id', b.dataset.id));
        toast('Rôle modifié'); rendre();
      });
    }
  };
}

const VUES = {
  accueil: vueAccueil, courses: vueCourses, entrainements: vueEntrainements,
  sondages: vueSondages, club: vueClub, profil: vueProfil, gestion: vueGestion
};

/* ---------- Démarrage ---------- */
async function demarrer() {
  $('#club img').alt = CONFIG.nomClub;
  document.title = CONFIG.nomClub;
  document.querySelectorAll('nav.onglets button').forEach(b => b.addEventListener('click', () => aller(b.dataset.onglet)));
  $('#btn-compte').addEventListener('click', () => aller('profil'));

  if (CONFIG.cle.includes('VOTRE') || CONFIG.url.includes('VOTRE')) {
    $('#main').innerHTML = `<div class="encart"><h2>Configuration à compléter</h2>
      <p>Ouvrez le fichier index.html et renseignez l'URL du projet Supabase et la clé publique dans le bloc CONFIG.</p></div>`;
    return;
  }
  if (typeof supabase === 'undefined') {
    $('#main').innerHTML = '<p class="vide">Impossible de charger l\'appli. Vérifiez votre connexion Internet puis rechargez la page.</p>';
    return;
  }
  sb = supabase.createClient(CONFIG.url, CONFIG.cle, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  S.session = data.session;
  await chargerProfil();
  sb.auth.onAuthStateChange((evenement, session) => {
    S.session = session;
    if (evenement === 'SIGNED_IN' || evenement === 'SIGNED_OUT') {
      // Différé pour éviter un blocage connu de supabase-js dans ce rappel
      setTimeout(async () => { await chargerProfil(); rendre(); }, 0);
    }
  });
  if (!S.session) S.onglet = 'entrainements';
  rendre();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
}
demarrer();
</script>
